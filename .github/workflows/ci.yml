name: CI

on:
  push:
    branches:
      - '**'

concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Bootstrap
        run: yarn install --immutable

      - name: Quality
        run: yarn quality

  test:
    name: Test (${{ matrix.cli_entry }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cli_entry: [src, dist]
    env:
      CLI_ENTRY: ${{ matrix.cli_entry }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Bootstrap
        run: yarn install --immutable

      - name: Build
        if: matrix.cli_entry == 'dist'
        run: yarn clean:build

      - name: Test
        run: ${{ matrix.cli_entry == 'dist' && 'yarn test' || 'yarn test:cov' }}

  example-test-joi-to-zod:
    name: Example Test joi-to-zod (${{ matrix.cli_entry }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cli_entry: [src, dist]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Bootstrap
        run: yarn install --immutable

      - name: Type check example (before transformation)
        run: yarn type-check:example

      - name: Lint example (before transformation)
        run: yarn lint:example

      - name: Run example tests (before transformation)
        run: yarn test:example

      - name: Build
        if: matrix.cli_entry == 'dist'
        run: yarn clean:build

      - name: Transform example
        env:
          CLI_ENTRY: ${{ matrix.cli_entry }}
        run: yarn transform:example

      # The example tests pass against Joi and Zod alike, so without this a codemod that
      # silently did nothing would still leave the job green.
      - name: Verify the example was actually transformed
        run: |
          code=$(grep -vE '^\s*//' example/joi-to-zod/schemas.ts)
          if ! printf '%s' "$code" | grep -qE "from ['\"]zod['\"]"; then
            echo "::error::example/joi-to-zod/schemas.ts does not import zod after transformation"
            exit 1
          fi
          if printf '%s' "$code" | grep -qE "Joi\.|from ['\"]joi['\"]"; then
            echo "::error::example/joi-to-zod/schemas.ts still references joi after transformation"
            exit 1
          fi

      - name: Type check example (after transformation)
        run: yarn type-check:example

      - name: Lint example (after transformation)
        run: yarn lint:example

      - name: Run example tests (after transformation)
        run: yarn test:example

  example-test-jest-to-vitest:
    name: Example Test jest-to-vitest (${{ matrix.cli_entry }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cli_entry: [src, dist]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Bootstrap
        run: yarn install --immutable

      - name: Install example dependencies (Jest)
        working-directory: example/jest-to-vitest
        run: npm install

      - name: Type check example (before transformation)
        working-directory: example/jest-to-vitest
        run: npm run type-check

      - name: Lint example (before transformation)
        run: yarn lint:example

      - name: Run example tests with Jest (before transformation)
        working-directory: example/jest-to-vitest
        run: npx jest

      # The transform rewrites package.json, so the lockfile no longer describes the dependency
      # set; drop both and let the post-transform install resolve from scratch.
      - name: Clean example dependencies
        working-directory: example/jest-to-vitest
        run: rm -rf node_modules package-lock.json

      - name: Build
        if: matrix.cli_entry == 'dist'
        run: yarn clean:build

      - name: Transform example
        env:
          CLI_ENTRY: ${{ matrix.cli_entry }}
        run: yarn transform:example:jest

      # The example tests would pass under either runner, so without this a codemod that silently
      # did nothing would still leave the job green.
      - name: Verify the example was actually transformed
        run: |
          if [ ! -f example/jest-to-vitest/vitest.config.ts ]; then
            echo "::error::the codemod did not generate example/jest-to-vitest/vitest.config.ts"
            exit 1
          fi
          if ! grep -rqE "from ['\"]vitest['\"]" example/jest-to-vitest/tests; then
            echo "::error::example/jest-to-vitest/tests does not import vitest after transformation"
            exit 1
          fi
          if grep -rqE "@jest/globals" example/jest-to-vitest/tests; then
            echo "::error::example/jest-to-vitest/tests still imports @jest/globals after transformation"
            exit 1
          fi
          # Some test titles name the jest API they cover, so compare against the code with string
          # literals stripped out rather than the raw file.
          code=$(cat example/jest-to-vitest/tests/*.ts | sed "s/'[^']*'//g; s/\"[^\"]*\"//g")
          if printf '%s' "$code" | grep -qE "jest\."; then
            echo "::error::example/jest-to-vitest/tests still calls the jest API after transformation"
            printf '%s' "$code" | grep -nE "jest\." || true
            exit 1
          fi

      - name: Install example dependencies (Vitest)
        working-directory: example/jest-to-vitest
        run: npm install

      - name: Type check example (after transformation)
        working-directory: example/jest-to-vitest
        run: npm run type-check

      - name: Lint example (after transformation)
        run: yarn lint:example

      - name: Run transformed tests with Vitest
        working-directory: example/jest-to-vitest
        run: npx vitest run
